name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build unsigned APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4
        with:
          cache-read-only: ${{ github.event_name == 'pull_request' }}
      - name: Invitation generator self-test
        run: python3 tools/passgen.py --selftest
      - name: Native JNI regression tests
        run: bash tools/test-native.sh
      - name: Unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unit-test-report-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            app/build/reports/tests/
            app/build/test-results/
          if-no-files-found: ignore
      - name: Upload unsigned build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release/*-unsigned.apk
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Sign and verify APK (trusted runs only)
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout signing script
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Download unsigned build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: unsigned-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/build/outputs/apk/release
      - name: Sign, verify per-API certificates and generate checksums
        env:
          OLD_KEYSTORE_B64: ${{ secrets.OLD_KEYSTORE_B64 }}
          OLD_KEYSTORE_PASS: ${{ secrets.OLD_KEYSTORE_PASS }}
          NEW_KEYSTORE_B64: ${{ secrets.NEW_KEYSTORE_B64 }}
          NEW_KEYSTORE_PASS: ${{ secrets.NEW_KEYSTORE_PASS }}
        run: bash tools/sign-release.sh app/build/outputs/apk/release
      - name: Upload verified APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TuneGrab-APK-${{ github.sha }}-${{ github.run_id }}
          path: |
            app/build/outputs/apk/release/TuneGrab-*.apk
            app/build/outputs/apk/release/SHA256SUMS
            app/build/outputs/apk/release/SIGNING-CERTIFICATES.txt
            app/build/outputs/apk/release/signing.lineage
          if-no-files-found: error

  publish:
    name: Publish verified release
    needs: [build, sign]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release notes
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Download verified release
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TuneGrab-APK-${{ github.sha }}-${{ github.run_id }}
          path: release
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: "${{ github.ref_name }} — Segurança"
          body_path: RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: |
            release/TuneGrab-*.apk
            release/SHA256SUMS
            release/SIGNING-CERTIFICATES.txt
            release/signing.lineage
